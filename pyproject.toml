[project]
name = "letterlens"
version = "0.2.0"
description = "Explain legal documents in plain language with Gemma 4 through the Gemini API"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jubair Hasan"}]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
ocr = ["pytesseract>=0.3", "pillow>=10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "agent", "config", "images", "ocr", "pdf", "tools"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
