[project]
name = "letterlens"
version = "0.1.0"
description = "Explain official letters in plain language with Gemma 4 through the Gemini API"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jubair Hasan"}]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "agent"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
