# /etc/nginx/sites-enabled/hacktoberfest.darthdemono.com on the VPS; the chat endpoint is rate limited
# because every request spends the Gemini key.
limit_req_zone $binary_remote_addr zone=letterlens:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name hacktoberfest.darthdemono.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hacktoberfest.darthdemono.com;

    client_max_body_size 10M;

    location = /chat {
        limit_req zone=letterlens burst=4 nodelay;
        proxy_pass http://10.10.0.2:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://10.10.0.2:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    ssl_certificate /etc/letsencrypt/live/hacktoberfest.darthdemono.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hacktoberfest.darthdemono.com/privkey.pem;
}
